name: Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SHOPIFY_DB_DSN: postgresql://postgres:postgres@localhost:5432/postgres
      PYTHONPATH: ${{ github.workspace }}
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "latest"
      - name: Install Postgres client tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
      - name: Wait for Postgres
        run: |
          for i in {1..30}; do
            if pg_isready --host=localhost --port=5432 --username=postgres; then
              exit 0
            fi
            sleep 1
          done
          exit 1
        env:
          PGPASSWORD: postgres
      - name: Seed Postgres with sample Shopify data
        run: |
          uv run python - <<'PY'
          import csv
          import json
          import os
          from pathlib import Path

          import psycopg

          dsn = os.environ["SHOPIFY_DB_DSN"]
          csv_path = Path("products_point_one_percent_sample.csv")
          max_rows = 500
          domain = "sample-store.myshopify.com"
          run_name = "sample_run"

          with psycopg.connect(dsn, autocommit=True) as conn:
            with conn.cursor() as cur:
              cur.execute("DROP SCHEMA IF EXISTS cantbuymelove CASCADE")
              cur.execute("CREATE SCHEMA cantbuymelove AUTHORIZATION postgres")
              cur.execute("DROP TABLE IF EXISTS public.product_details")
              cur.execute(
                """
                CREATE TABLE cantbuymelove.product (
                  id BIGINT PRIMARY KEY,
                  myshopify_domain TEXT NOT NULL,
                  run_name TEXT NOT NULL,
                  product_handle TEXT NOT NULL,
                  product_title TEXT NOT NULL
                ) TABLESPACE pg_default
                """
              )
              cur.execute(
                """
                CREATE TABLE public.product_details (
                  myshopify_domain TEXT NOT NULL,
                  run_name TEXT NOT NULL,
                  product_handle TEXT NOT NULL,
                  product_detail JSONB NOT NULL,
                  PRIMARY KEY (myshopify_domain, run_name, product_handle)
                ) TABLESPACE pg_default
                """
              )
              cur.execute(
                """
                CREATE TABLE cantbuymelove.taxonomy (
                  taxonomy_id TEXT PRIMARY KEY,
                  taxonomy_path TEXT NOT NULL
                ) TABLESPACE pg_default
                """
              )
              cur.execute(
                """
                CREATE TABLE cantbuymelove.product_taxonomy (
                  product_id BIGINT PRIMARY KEY,
                  taxonomy_id TEXT NOT NULL
                ) TABLESPACE pg_default
                """
              )

            # Insert sample taxonomy records
            with conn.cursor() as cur:
              sample_taxonomies = [
                ("gid://shopify/TaxonomyCategory/aa-1-1", "1.1.1"),
                ("gid://shopify/TaxonomyCategory/aa-1-2", "1.1.2"),
                ("gid://shopify/TaxonomyCategory/aa-1-3", "1.1.3"),
                ("gid://shopify/TaxonomyCategory/aa-2-1", "1.2.1"),
                ("gid://shopify/TaxonomyCategory/aa-2-2", "1.2.2"),
                ("gid://shopify/TaxonomyCategory/aa-3-1", "1.3.1"),
              ]
              for taxonomy_id, taxonomy_path in sample_taxonomies:
                cur.execute(
                  "INSERT INTO cantbuymelove.taxonomy (taxonomy_id, taxonomy_path) VALUES (%s, %s)",
                  (taxonomy_id, taxonomy_path),
                )

            with conn.cursor() as cur, csv_path.open(newline="", encoding="utf-8") as handle:
              sample_taxonomy_ids = [
                "gid://shopify/TaxonomyCategory/aa-1-1",
                "gid://shopify/TaxonomyCategory/aa-1-2",
                "gid://shopify/TaxonomyCategory/aa-1-3",
                "gid://shopify/TaxonomyCategory/aa-2-1",
                "gid://shopify/TaxonomyCategory/aa-2-2",
                "gid://shopify/TaxonomyCategory/aa-3-1",
              ]
              reader = csv.DictReader(handle)
              for idx, row in enumerate(reader, start=1):
                if idx > max_rows:
                  break

                product_handle = f"product-{idx}"
                product_detail = json.dumps({"product": {"tags": row["tags"]}})
                # Assign taxonomy_id in round-robin fashion
                taxonomy_id = sample_taxonomy_ids[(idx - 1) % len(sample_taxonomy_ids)]

                cur.execute(
                  """
                  INSERT INTO cantbuymelove.product (
                    id,
                    myshopify_domain,
                    run_name,
                    product_handle,
                    product_title
                  ) VALUES (%s, %s, %s, %s, %s)
                  """,
                  (idx, domain, run_name, product_handle, row["title"] or ""),
                )
                cur.execute(
                  """
                  INSERT INTO public.product_details (
                    myshopify_domain,
                    run_name,
                    product_handle,
                    product_detail
                  ) VALUES (%s, %s, %s, %s)
                  """,
                  (domain, run_name, product_handle, product_detail),
                )
                cur.execute(
                  "INSERT INTO cantbuymelove.product_taxonomy (product_id, taxonomy_id) VALUES (%s, %s)",
                  (idx, taxonomy_id),
                )
          PY
      - name: Verify seed data
        run: |
          psql --host=localhost --port=5432 --username=postgres --dbname=postgres -c "\dt cantbuymelove.*"
          psql --host=localhost --port=5432 --username=postgres --dbname=postgres -c "SELECT COUNT(*) FROM cantbuymelove.product"
          psql --host=localhost --port=5432 --username=postgres --dbname=postgres -c "SELECT COUNT(*) FROM cantbuymelove.taxonomy"
        env:
          PGPASSWORD: postgres
      - name: Run tests
        run: uv run -m pytest -q -m "not slow"
      - name: Test datadumps (real data validation)
        run: uv run -m pytest -v -m slow tests/test_datadumps.py
        continue-on-error: true  # Don't fail if dumps aren't available yet
      - name: Run pipeline scripts
        run: |
          uv run padjective/tagbattle.py \
            --dsn "$SHOPIFY_DB_DSN" \
            --schema padjective \
            --product-table cantbuymelove.product
          uv run padjective/ranking.py \
            --dsn "$SHOPIFY_DB_DSN" \
            --schema padjective \
            --output-table tag_rankings
          uv run padjective/display.py \
            --dsn "$SHOPIFY_DB_DSN" \
            --schema padjective \
            --table tag_rankings \
            --html tag_rankings.html \
            --image tag_rankings.png
