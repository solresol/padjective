name: Padjective native diagnostic
on:
  push:
    branches:
      - codex/padjective-ci-native-diagnostic-20261123
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONFAULTHANDLER: '1'
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11.18'
      - uses: astral-sh/setup-uv@v6
        with:
          version: latest
      - name: Inspect runner and locked runtime
        run: |
          set -euo pipefail
          ulimit -c 0
          uv sync --locked
          uname -a
          lscpu
          uv run --no-sync python - <<'PY'
          import json, os, platform, sys
          import numpy, scipy, sklearn
          from threadpoolctl import threadpool_info
          print(sys.version)
          print(platform.platform())
          print('Affinity:', sorted(os.sched_getaffinity(0)))
          print('Libraries:', numpy.__version__, scipy.__version__, sklearn.__version__)
          print('Thread environment:', {k: os.getenv(k) for k in ('OMP_NUM_THREADS','OPENBLAS_NUM_THREADS','MKL_NUM_THREADS','BLIS_NUM_THREADS')})
          print(json.dumps(threadpool_info(), indent=2))
          numpy.show_config()
          scipy.show_config()
          PY
      - name: Exact classifier in fresh process
        id: targeted
        continue-on-error: true
        run: |
          ulimit -c 0
          uv run --no-sync -m pytest -vv tests/test_taxonomy_levelwise_classifier.py::test_levelwise_classifier_predicts_valid_taxonomy_leaf
      - name: Collect all modules but execute target only
        id: collected
        continue-on-error: true
        run: |
          ulimit -c 0
          uv run --no-sync -m pytest -vv -m 'not slow' -k test_levelwise_classifier_predicts_valid_taxonomy_leaf
      - name: Collect all and execute preceding test plus target
        id: pair
        continue-on-error: true
        run: |
          ulimit -c 0
          uv run --no-sync -m pytest -vv -m 'not slow' -k 'test_compute_taxonomy_top_tags_binary_expansion or test_levelwise_classifier_predicts_valid_taxonomy_leaf'
      - name: Verify fast suite without levelwise classifier file
        id: remainder
        continue-on-error: true
        run: |
          ulimit -c 0
          uv run --no-sync -m pytest -vv -m 'not slow' --ignore=tests/test_taxonomy_levelwise_classifier.py
      - name: Verify entire levelwise classifier file separately
        id: isolated_file
        continue-on-error: true
        run: |
          ulimit -c 0
          uv run --no-sync -m pytest -vv -m 'not slow' tests/test_taxonomy_levelwise_classifier.py
      - name: Try available native debugger without installation
        continue-on-error: true
        run: |
          ulimit -c 0
          if command -v lldb >/dev/null; then
            timeout 180 lldb --batch -o 'settings set target.disable-aslr false' -o 'run' -k 'bt 30' -k 'image list' \
              -- .venv/bin/python -m pytest -vv -m 'not slow'
          else
            echo 'Neither GDB (previous run) nor LLDB was available; no installation attempted.'
          fi
      - name: Surface differential outcomes
        if: always()
        env:
          ONLY: ${{ steps.collected.outcome }}
          PAIR: ${{ steps.pair.outcome }}
          REST: ${{ steps.remainder.outcome }}
          FILE: ${{ steps.isolated_file.outcome }}
        run: printf 'collect-only target=%s; preceding + target=%s; remainder=%s; isolated file=%s\n' "$ONLY" "$PAIR" "$REST" "$FILE"
