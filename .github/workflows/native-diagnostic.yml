name: Padjective native diagnostic
on:
  push:
    branches:
      - codex/padjective-ci-native-diagnostic-20261123
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONFAULTHANDLER: '1'
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11.18'
      - uses: astral-sh/setup-uv@v6
        with:
          version: latest
      - name: Inspect runner and locked runtime
        run: |
          set -euo pipefail
          ulimit -c 0
          uv sync --locked
          uname -a
          lscpu
          uv run --no-sync python - <<'PY'
          import json, os, platform, sys
          import numpy, scipy, sklearn
          from threadpoolctl import threadpool_info
          print(sys.version)
          print(platform.platform())
          print('Affinity:', sorted(os.sched_getaffinity(0)))
          print('Libraries:', numpy.__version__, scipy.__version__, sklearn.__version__)
          print('Thread environment:', {k: os.getenv(k) for k in ('OMP_NUM_THREADS','OPENBLAS_NUM_THREADS','MKL_NUM_THREADS','BLIS_NUM_THREADS')})
          print(json.dumps(threadpool_info(), indent=2))
          numpy.show_config()
          scipy.show_config()
          PY
      - name: Bound test execution prefix after complete collection
        run: |
          ulimit -c 0
          uv run --no-sync python .github/diagnostics/padjective_prefix.py
      - name: Compare two-test order with and without threadpool restoration
        run: |
          ulimit -c 0
          set +e
          uv run --no-sync python .github/diagnostics/padjective_thread_fixture.py default
          echo "unrestored pair exit=$?"
          uv run --no-sync python .github/diagnostics/padjective_thread_fixture.py restored
          echo "restored pair exit=$?"
